# P3-S6X arm `s6` on Bonn person_tracking (pt1). Mirrors p3s6x_s6_balloon.yaml with the base
# swapped to that sequence's P2-T prune run config; see that file (and this directory's README)
# for why the arm inherits from the anchor and why the knob values may not be edited.
#
# pt1 and pt2 are the campaign's hard-tracking sequences (P2-T prune ATE ~11 cm vs ~3 cm on
# balloon). If `ttl=1` costs anything through the pose channel, this is where it should show —
# and it is exactly the channel the frozen-trajectory regime could not expose.
inherit_from: "configs/rgbd/experiments/p2_render/p2s_combined_prune_pt1.yaml"
method: "Combined-Prune-S6-maxpress"

DeferredCommit:
  ttl_keyframes: 1

Training:
  gaussian_th: 0.9

opt_params:
  densify_grad_threshold: 0.0005
