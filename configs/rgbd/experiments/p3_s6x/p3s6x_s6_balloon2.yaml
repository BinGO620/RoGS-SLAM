# P3-S6X arm `s6` on Bonn balloon2. Mirrors p3s6x_s6_balloon.yaml with the base swapped to
# that sequence's P2-T prune run config; see that file (and this directory's README) for why
# the arm inherits from the anchor and why the three knob values may not be edited here.
inherit_from: "configs/rgbd/experiments/p2_render/p2s_combined_prune_balloon2.yaml"
method: "Combined-Prune-S6-maxpress"

DeferredCommit:
  ttl_keyframes: 1

Training:
  gaussian_th: 0.9

opt_params:
  densify_grad_threshold: 0.0005
