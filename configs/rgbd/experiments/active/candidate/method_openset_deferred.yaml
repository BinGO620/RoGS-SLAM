# R1-P01 open-set arm: DEFERRED = pre-instantiation lifecycle candidate（承重新颖点）。
# 与 prune 臂的唯一允许差异 = Mapping.lifecycle_mode（method 字段自动豁免）。
# 其余字段必须与 method_openset_prune.yaml 逐字段一致（contract 会校验 effective diff）。
TriReliability:
  enabled: false

ReliabilitySignal:
  enabled: true

DeferredCommit:
  enabled: true
  reliability_confirm: true

Mapping:
  lifecycle_mode: "deferred"

Results:
  save_raw_metrics: true
  static_bg_mask_subdir: "dynamic_mask_gtmc"
  static_bg_band_px: [10, 25, 50]
