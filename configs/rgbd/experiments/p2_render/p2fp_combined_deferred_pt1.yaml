# P2-T de-confounding control, arm B: COMBINED backbone + deferred lifecycle, FROZEN-POSE on
# Bonn person_tracking. Twin of p2fp_combined_prune_pt1.yaml; the pair differs ONLY in
# Mapping.lifecycle_mode (same backbone, same injected trajectory, same pose freeze). See
# p2fp_combined_prune_pt1.yaml for the full rationale (hermes blind-spot de-confound; ATE is a
# canary not an outcome; correct observables are map-level G_def/G_prune + vac_depth/vac_psnr).
#
# The deferred arm's provisional-candidate lifecycle is the hypothesised map-level channel
# (provisional candidates perturb densify) that this control isolates from tracking.
inherit_from: "configs/rgbd/bonn/person_tracking.yaml"
method_from: "configs/rgbd/experiments/active/candidate/method_combined_maskboth_deferred.yaml"
method: "CombinedFP-Deferred"

Oracle:
  pose_file: "/data/monogs-ours/external_trajectories/rgd/bonn_person_tracking/seed_0/slam_outputs/Datasets_Bonn/2026-06-25-13-11-13/plot/trj_final.json"

Training:
